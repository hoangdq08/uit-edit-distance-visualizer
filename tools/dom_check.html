<!DOCTYPE html>
<html lang="vi">
<head><meta charset="utf-8"><title>dom-check</title></head>
<body>
<!-- Chay duoc bang: chrome --headless --dump-dom file:///.../tools/dom_check.html
     Nap index.html trong iframe cung goc (file://), di het moi buoc cua nhieu cap chuoi bang window.__demo.go(),
     kiem tra DOM that sau moi buoc, ghi ket qua vao <pre id="out">. -->
<iframe id="f" src="../index.html" style="width:1400px;height:1000px"></iframe>
<pre id="out">RUNNING</pre>
<script>
(function () {
  var out = document.getElementById('out');
  var f = document.getElementById('f');
  var errors = [], stats = { pairs: 0, steps: 0, cellSame: 0, cellDiff: 0, trace: 0 };
  function err(m) { if (errors.length < 15) errors.push(m); errors.count = (errors.count || 0) + 1; }

  var PAIRS = [['LOVE', 'MOVIE'], ['KITTEN', 'SITTING'], ['SUNDAY', 'SATURDAY'], ['INTENTION', 'EXECUTION'],
    ['TAT', 'TBT'], ['ABCDEF', 'ABCDE'], ['AAAAAA', 'AAA'], ['', 'ABC'], ['ABC', ''], ['ABC', 'ABC'], ['', ''],
    ['ABCDEFGHIJKLMNOPQRST', 'TSRQPONMLKJIHGFEDCBA'], ['A', 'B'], ['XYZ', 'XYZ']];

  function run() {
    var w = f.contentWindow, d = w.document, demo = w.__demo, PC = w.Pseudocode;
    if (!demo) { out.textContent = 'FAIL: window.__demo missing'; return; }
    PAIRS.forEach(function (p) {
      demo.load(p[0], p[1]);
      var m = demo.model; stats.pairs++;
      if (m.a.join('') !== p[0] || m.b.join('') !== p[1]) err('load sai ' + p);
      var nSteps = m.steps.length;
      for (var s = 0; s < nSteps; s++) {
        demo.go(s); stats.steps++;
        var st = m.steps[s];
        var lis = d.querySelectorAll('#pseudo li');
        var act = [], ctx = [];
        for (var i = 0; i < lis.length; i++) {
          if (lis[i].className === 'act') act.push(i + 1);
          else if (lis[i].className === 'ctx') ctx.push(i + 1);
        }
        var want = PC.forStep(st);
        if (JSON.stringify(act) !== JSON.stringify(want.act.slice().sort(function (a, b) { return a - b; }))) err(p + ' step ' + s + ' act DOM ' + act + ' != ' + want.act);
        if (JSON.stringify(ctx) !== JSON.stringify(want.ctx.slice().sort(function (a, b) { return a - b; }))) err(p + ' step ' + s + ' ctx DOM ' + ctx);
        if (lis.length !== PC.LINES.length) err('so dong ma gia ' + lis.length);
        // Doc CHU THAT cua dong dang sang (khong dung PC.forStep) de bat loi anh xa sai
        var actText = act.map(function (n) { return lis[n - 1].textContent; }).join(' | ');
        if (st.type === 'cell') {
          var hasEq = actText.indexOf('dp[i][j] ← dp[i-1][j-1]') >= 0, hasMin = actText.indexOf('1 + min(') >= 0;
          if (st.same && (!hasEq || hasMin)) err(p + ' step ' + s + ' o TRUNG nhung dong sang: ' + actText);
          if (!st.same && (hasEq || !hasMin)) err(p + ' step ' + s + ' o KHAC nhung dong sang: ' + actText);
        } else if (st.type === 'trace' && st.move) {
          var kw = { keep: 'giữ', replace: 'thay', delete: 'xóa', insert: 'thêm' }[st.move.kind];
          if (actText.indexOf(kw + ' A[i]') < 0 && actText.indexOf(kw + ' B[j]') < 0) err(p + ' step ' + s + ' thao tac ' + st.move.kind + ' nhung dong sang: ' + actText);
        }

        var si = d.getElementById('stepInfo').textContent;
        if (si.indexOf('Bước ' + s + ' / ' + (nSteps - 1)) < 0) err(p + ' stepInfo "' + si + '" step ' + s);
        if (d.getElementById('btnBack').disabled !== (s === 0)) err(p + ' Back disabled sai o ' + s);
        if (d.getElementById('btnNext').disabled !== (s === nSteps - 1)) err(p + ' Next disabled sai o ' + s);

        if (st.type === 'cell') {
          (st.same ? stats.cellSame++ : stats.cellDiff++);
          var cur = d.querySelectorAll('#dp td.cur');
          if (cur.length !== 1) err(p + ' step ' + s + ' so o cur=' + cur.length);
          else if (cur[0].dataset.i != st.i || cur[0].dataset.j != st.j) err(p + ' o cur sai');
          // o dang tinh phai hien dung gia tri dp
          if (cur.length && cur[0].textContent !== String(st.value)) err(p + ' gia tri o ' + cur[0].textContent + ' != ' + st.value);
          // chi dung dp[i-1][j-1] khi trung; ba nguon khi khac
          var tagged = d.querySelectorAll('#dp td[data-tag]').length;
          if (tagged !== (st.same ? 1 : 3)) err(p + ' step ' + s + ' so o nguon=' + tagged + ' same=' + st.same);
          // cac o chua tinh phai an so (khong ro gia tri tuong lai): chi o co class vis moi duoc hien
          var hidden = d.querySelectorAll('#dp td:not(.vis):not(.cur):not(.dg):not(.up):not(.lf)');
          for (var h = 0; h < hidden.length; h++) {
            var hi = +hidden[h].dataset.i, hj = +hidden[h].dataset.j;
            if (m.cellStep[hi][hj] <= s && hi > 0 && hj > 0) err(p + ' o (' + hi + ',' + hj + ') da tinh nhung dang an');
          }
          var ex = d.getElementById('explain').textContent;
          if (ex.indexOf('dp[' + st.i + '][' + st.j + ']') < 0) err(p + ' explain thieu o dang tinh');
          if (st.same ? ex.indexOf('trùng') < 0 : ex.indexOf('min(') < 0) err(p + ' explain sai nhanh');
        } else if (st.type === 'trace') {
          stats.trace++;
          var pa = d.querySelectorAll('#dp td.pa').length;
          if (pa !== st.k + 1) err(p + ' step ' + s + ' so o duong tim=' + pa + ' != ' + (st.k + 1));
          var shown = d.querySelectorAll('#ops li.show').length;
          if (shown !== Math.min(st.k + 1, m.moves.length)) err(p + ' step ' + s + ' so thao tac hien=' + shown);
        }
        if (s === nSteps - 1) {
          var dist = d.querySelector('#result .dist');
          if (!dist || dist.textContent !== String(m.distance)) err(p + ' ket qua cuoi sai: ' + (dist && dist.textContent) + ' != ' + m.distance);
          var oplis = d.querySelectorAll('#ops li').length;
          if (oplis !== m.ops.length) err(p + ' so thao tac ' + oplis + ' != ' + m.ops.length);
          // chuoi sau thao tac cuoi phai bang B
          if (m.ops.length && m.ops[m.ops.length - 1].result !== p[1]) err(p + ' chuoi cuoi != B');
        } else if (st.type === 'trace') {
          var dd = d.querySelector('#result .dist');
          if (dd && dd.textContent !== '?') err(p + ' ket qua lo ra som o step ' + s);
        }
      }
    });
    // input qua dai
    demo.load('A'.repeat(21), 'B');
    if (d.getElementById('inputMsg').textContent.indexOf('20') < 0) err('khong bao loi khi qua 20 ky tu');
    out.textContent = (errors.length ? 'FAIL' : 'PASS') + ' pairs=' + stats.pairs + ' steps=' + stats.steps +
      ' cellSame=' + stats.cellSame + ' cellDiff=' + stats.cellDiff + ' trace=' + stats.trace +
      ' errors=' + (errors.count || 0) + (errors.length ? '\n' + errors.join('\n') : '');
  }
  f.addEventListener('load', function () { try { run(); } catch (e) { out.textContent = 'FAIL exception: ' + e.message + '\n' + e.stack; } });
})();
</script>
</body>
</html>
